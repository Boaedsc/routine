<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <title>Messe du jour</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Messe">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Messe du jour</h1>
    <p id="date"></p>

    <p class="picker">
      <label for="date-picker">Date&nbsp;:</label>
      <input type="date" id="date-picker">
    </p>

    <p class="picker" id="choix-messe-wrap" hidden>
      <label for="choix-messe">Messe&nbsp;:</label>
      <select id="choix-messe"></select>
    </p>

    <h2 id="titre"></h2>

    <div id="messe" aria-live="polite"></div>
  </main>
  <script src="app.js" defer></script>
</body>
</html>
